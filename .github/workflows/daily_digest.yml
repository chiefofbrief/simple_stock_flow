name: Daily Market Analysis

on:
  schedule:
    # Runs at 12:30 UTC (8:30 AM EDT) Tuesday-Friday
    - cron: '30 12 * * 2-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push the generated digest back to the repo
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- NEW STEP ADDED: Authenticate with Google Cloud using your new JSON key ---
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-cloud-aiplatform # ADDED: Required library for Vertex AI

      - name: Cache Today's Digest
        uses: actions/cache@v4
        with:
          path: Peter's Digest
          key: digest-${{ runner.os }}-${{ github.run_id }}-${{ strategy.job_index }}-${{ github.sha }}
          # Restore from any digest- cache created today to prevent redundant API calls
          restore-keys: |
            digest-${{ runner.os }}-

      - name: Run Digest and Analysis
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          LOCATION: us-central1
          SOCIAVAULT_API_KEY: ${{ secrets.SOCIAVAULT_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          PERIGON_API_KEY: ${{ secrets.PERIGON_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO || secrets.EMAIL_USER }}
        run: |
          python Scripts/automation_peters_digest.py

      - name: Commit and Push Digest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "Peter's Digest/"
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: add latest daily digest and analysis [skip ci]" && git push)

      - name: Run Tracker Priority
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          LOCATION: us-central1
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO || secrets.EMAIL_USER }}
        run: |
          python Scripts/automation_tracker_priority.py

      - name: Push Tracker Changes
        run: |
          git pull --rebase
          git push
